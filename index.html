<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API by J.F. Vecina</title>
    <link rel="icon" type="image/x-icon" href="images/svg/sun.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1 id="main_heading">Weather App</h1>
        <p id="subtitle">Built By John Francis Vecina</p> 
    </header>
    <main>
        <section class="user_input">
            <input class="search_bar" type="text" placeholder="Search City">
            <button class="search_button">sSearch</button>
        </section>

        <section class="weather_section">
            <div class="introduction">
                <h2 class="intro">Weather at a glance</h2>
                <p class="desc">Search for a city to see the current temperature, weather condition, humidity, and wind.</p>
            </div>
        </section>
    </main>
    <script src="main.js" type="module"></script>
</body>
</html>
